name: Signal Analytics — weekly transition statistics

permissions:
  contents: read

on:
  # Every Sunday at 04:00 UTC — after a week of transitions have accumulated
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  signal-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout marketscan
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install psycopg2-binary numpy

      - name: Run signal analytics
        run: python -m backend_worker.signal_analytics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summary
        run: echo "Signal analytics complete — signal_persistence_cache updated"
