name: QMJ Scores

permissions:
  contents: read

# Veckovis QMJ-komposit: kvalitet/momentum/insider/värde/payout med punkt-i-tid-regel.
# Standard: bearbeta ALLA listade tickers (0 = alla); --limit-tickers N för manuella
# begränsade körningar (cache: data/qmj_raw/).
# Körs fredag natt; vid behov manuellt (workflow_dispatch: limit-tickers).

on:
  schedule:
    - cron: "15 4 * * 5"      # Fredag 04:15 UTC (efter shorts 03:50 + fi_insider 03:40 — samma-dagsdata)
  workflow_dispatch:
    inputs:
      limit_tickers:
        description: "Antal tickers att bearbeta (0 = alla — standard)"
        required: false
        default: "0"
        type: string

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  qmj:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend_worker/requirements.txt

      - name: Compute QMJ scores
        run: |
          LIMIT="${{ github.event.inputs.limit_tickers || '0' }}"
          python -m backend_worker.qmj_scores --limit-tickers "$LIMIT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
