name: FI Insider Bulk

permissions:
  contents: read

# Daglig bulk-ingestion av FI:s insynsregister + klusterscoring.
# Ersätter den gamla per-ticker Finnhub-workern som primär källa.

on:
  schedule:
    - cron: "40 3 * * 1-5"   # Vardagar 03:40 UTC (ca 05:40 Stockholm)
  workflow_dispatch:
    inputs:
      days:
        description: "Antal dagar bakåt att hämta"
        required: false
        default: "7"
        type: string

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  fi-insider:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml

      # ── Steg 1: Bulk-ingestion ──────────────────────────────────────────────
      - name: Fetch FI insider register
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python -m backend_worker.fi_insider_bulk --days "$DAYS"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Steg 2: Klusterscoring ──────────────────────────────────────────────
      - name: Calculate insider clusters
        run: |
          python -m backend_worker.insider_cluster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Steg 3: FI↔Finnhub-rekonciliering (kvalitetsgrind, coverage-first) ──
      - name: Reconcile FI vs Finnhub
        run: |
          python -m backend_worker.insider_reconcile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
