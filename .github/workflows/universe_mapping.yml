name: Universe Mapping

permissions:
  contents: read

# Daglig synk av universumsregistret: FI-emittenter (sanning) + ISIN→ticker-mappning
# + delisting-detektor (Yahoo-presence). Används av shorts/QMJ/insider-arbetare.

on:
  schedule:
    - cron: "45 3 * * *"    # Dagligen 03:45 UTC
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  universe-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml

      - name: Sync universe registry
        run: python -m backend_worker.universe_mapping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # NOT: Finnhub /stock/symbol har INGEN nordisk täckning på free tier
      # (verifierat 2026-08-28: SE/FI/DK/NO/IS → 0 symboler). Täckningsvägen är
      # FI-registret + profile2?isin=-mapparen (gratis). Modulen
      # backend_worker/finnhub_universe.py finns kvar för en framtida betald tier.
