name: FI Short Positions

permissions:
  contents: read

# Daglig snapshot av FI:s blankningsregister (net short positions).
# Riskfilter + ny-disclosure-varning. 0-rader-fetch → jobb failar (formatändring-larm).

on:
  schedule:
    - cron: "50 3 * * *"    # Dagligen 03:50 UTC
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  fi-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml

      - name: Snapshot short positions
        run: python -m backend_worker.fi_short_positions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
