name: Alpha Discovery Radar

permissions:
  contents: read

# Autonom Guldkorns-Radar för Nordiska Småbolag
# Körs vardagar 05:00 UTC (efter Cision, insider och QMJ)

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      limit_candidates:
        description: "Antal kandidater att skanna (0 = alla)"
        required: false
        default: "50"
        type: string

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  alpha-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml

      - name: Run Alpha Discovery & Guldkorn Scanner
        run: |
          python -m backend_worker.run_alpha_discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
