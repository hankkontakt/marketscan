name: Smallcap Scan

permissions:
  contents: read

on:
  schedule:
    - cron: "30 5 * * 2"  # Every Tuesday at 05:30 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance python-dotenv finnhub-python
      - name: Run smallcap scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python smallcap_scanner.py | tee smallcap_output.json
