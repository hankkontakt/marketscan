name: Earnings Surprise (TS-SUE)

permissions:
  contents: read

# Veckovis snapshot av kvartalsöverraskningar (TS-SUE) per listad ticker.
# Källa: yfinance earnings_dates. SUE är ett MÅTT, inte en prediktion.
# PIT-snapshot: estimat fångat före annonsering sparas för kommande kvartal.

on:
  schedule:
    - cron: "10 4 * * 1"    # Måndagar 04:10 UTC
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  earnings-surprise:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend_worker/requirements.txt

      - name: Compute earnings surprises
        run: python -m backend_worker.earnings_surprise
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}