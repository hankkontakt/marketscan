name: Weekly Digest — send email summaries

permissions:
  contents: read

on:
  # Every Monday at 07:30 UTC (09:30 Swedish summer time)
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log recipients but do not send emails)"
        required: false
        default: "false"
        type: boolean

jobs:
  send-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout marketscan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install psycopg2-binary httpx

      - name: Send weekly digests
        run: python -m backend_worker.digest_mailer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM || secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Summary
        run: echo "Weekly digest job complete"
