name: QMJ Factor Regime

permissions:
  contents: read

# Månadsvis QMJ-faktorregim (AQR Quality Minus Junk, nordisk komposit SWE/DNK/FIN/NOR).
# R12-premie → OOS-expanderande percentil → Stark/Normal/Svag. Historisk kontext,
# ej prognos. AQR uppdaterar med ~2 månaders lag → körs den 8:e varje månad.

on:
  schedule:
    - cron: "10 4 8 * *"    # 8:e varje månad 04:10 UTC
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  qmj-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt

      - name: Compute QMJ factor regime
        run: python -m backend_worker.factor_regime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}