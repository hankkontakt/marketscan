name: Backtest Runner

permissions:
  contents: read

on:
  schedule:
    - cron: "0 8 * * 0"  # Every Sunday at 08:00 UTC
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy name (momentum/mean_reversion/trend_following/factor)"
        required: true
        default: "momentum"
        type: string

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance python-dotenv
      - name: Run backtest
        run: python backtest_runner.py "${{ github.event.inputs.strategy || 'momentum' }}" | tee backtest_output.json
