name: Insider Trades — fetch via Finnhub

permissions:
  contents: read

# Fetches insider buy/sell transactions for all tickers in scan_results
# and upserts them into the insider_trades table.
#
# Runs nightly at 03:30 UTC (after the main pipeline at 03:00) and can be
# triggered manually from the admin panel or GitHub Actions UI.

on:
  schedule:
    - cron: "30 3 * * *"   # Every day at 03:30 UTC, after main pipeline
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker to refresh (blank = all)"
        type: string
        default: ""
      days:
        description: "Lookback days (default: 90)"
        type: string
        default: "90"

env:
  TZ: "Europe/Stockholm"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ~1200 tickers × 1.1s ≈ 22 min; 60 min is a safe ceiling

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install psycopg2-binary

      # ── Step 1: Ensure reconcile key (unique index) exists — migration 049 ─────────────────────────────
      # Migration 049 replaced insider_trades_dedup_key (027) with the unique
      # index insider_trades_reconcile_key — never recreate the old constraint.
      - name: Run migration — ensure reconcile key (unique index)
        run: |
          python - <<'EOF'
          import os, psycopg2

          dsn = os.environ["DATABASE_URL"]
          conn = psycopg2.connect(dsn)
          cur = conn.cursor()

          cur.execute("""
            CREATE UNIQUE INDEX IF NOT EXISTS insider_trades_reconcile_key
              ON insider_trades (COALESCE(isin, ticker), name, trade_date, type);
          """)
          conn.commit()

          cur.execute("SELECT COUNT(*) FROM insider_trades")
          count = cur.fetchone()[0]
          conn.close()

          print(f"Migration OK — insider_trades table ready ({count} existing rows)")
          EOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Step 2: Fetch insider trades ───────────────────────────────────────
      - name: Fetch insider trades
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            EXTRA_ARGS="--ticker ${{ github.event.inputs.ticker }}"
          fi
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-90}"
          python -m backend_worker.insider_fetcher $EXTRA_ARGS --days "$DAYS"
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONPATH: "."
