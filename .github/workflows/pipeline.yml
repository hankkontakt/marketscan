name: MarketScan Pipeline

permissions:
  contents: read

on:
  schedule:
    # Morning scan (~06:15 Stockholm)
    - cron: "15 5 * * 1-5"
    # Evening update (~18:30 Stockholm)
    - cron: "30 17 * * 1-5"
    # Weekly deep scan (Sunday ~07:00 Stockholm, spread from company_profiles 07:00 UTC)
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode (morning/evening/weekly/manual/smallcap/targeted)"
        required: true
        default: "morning"
        type: string
      tickers:
        description: "Comma-separated tickers for targeted mode (optional)"
        required: false
        default: ""
        type: string

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: ".:stock-scanner"

jobs:
  run-pipeline:
    name: "${{ github.event.inputs.mode || 'scheduled' }} scan"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout marketscan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout stock-scanner (optional dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hankkontakt/stock-scanner
          token: ${{ secrets.GH_CHECKOUT_TOKEN }}
          path: stock-scanner
        continue-on-error: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend_worker deps
        run: |
          pip install -r backend_worker/requirements.txt
          if [ -f stock-scanner/requirements.txt ]; then pip install -r stock-scanner/requirements.txt; fi

      - name: Supabase heartbeat (keep DB warm)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/scan_results?select=count&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
        continue-on-error: true

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'morning' }}"
          TICKERS="${{ github.event.inputs.tickers || '' }}"
          if [ -n "$TICKERS" ]; then
            python -m backend_worker.pipeline.entrypoint --mode "$MODE" --tickers "$TICKERS"
          else
            python -m backend_worker.pipeline.entrypoint --mode "$MODE"
          fi
