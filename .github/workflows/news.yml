name: News Pipeline

permissions:
  contents: read

# Nyhetskedjan: officiella Nasdaq-meddelanden (regelbäringar) → bred GNews-
# discovery (mention-surge) → DeepSeek-klassificering av resterande händelser.
# Allt körs på GH Actions — inget lokalt. Cron 04:40 UTC (efter shorts 03:50).

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml
      - name: Nasdaq official announcements (rule bearings)
        run: python -m backend_worker.news_events
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cision MAR official press releases (real-time stream)
        run: python -m backend_worker.news_stream_cision --dry-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Google News theme sweep (mention surge)
        run: python -m backend_worker.news_discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  classify:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml
      - name: DeepSeek classification (thinking disabled, JSON mode)
        run: python -m backend_worker.news_classifier --limit 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
