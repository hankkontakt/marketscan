name: News Pipeline

# Nyhetskedjan: officiella Nasdaq-meddelanden (regelbäringar) → bred GNews/DDGS-
# discovery (mention-surge) → DeepSeek-klassificering av resterande händelser.
# Allt körs på GH Actions — inget lokalt. Cron 04:40 UTC (efter shorts 03:50).

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

env:
  TZ: "Europe/Stockholm"
  PYTHONPATH: "."

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml
      - name: Nasdaq official announcements (rule bearings)
        run: python -m backend_worker.news_events
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Google News theme sweep + DDGS (mention surge)
        run: python -m backend_worker.news_discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  classify:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend_worker/requirements.txt
          pip install beautifulsoup4 lxml
      - name: DeepSeek classification (thinking disabled, JSON mode)
        run: python -m backend_worker.news_classifier --limit 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
